<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER 6 ESPORTS — Переход...</title>
  <link rel="canonical" href="https://cyber6esports.github.io/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #07080b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    a { color: #f5b041; text-decoration: none; font-weight: 700; }
  </style>
  <script>
    (function () {
      var BASE_URL = "https://cyber6esports.github.io";
      var ALLOWED = [
        "home", "team", "history", "news", "schedule", "practice",
        "pantheon", "join", "chat", "shop", "reviews", "about", "media", "app-hub"
      ];
      var ALIASES = {
        "roster": "team",
        "players": "team",
        "matches": "history",
        "results": "history",
        "stats": "history",
        "apex": "pantheon",
        "rank": "pantheon",
        "pracs": "practice",
        "scrims": "practice",
        "apply": "join",
        "recruitment": "join"
      };
      var rawPath = (window.location.pathname || "/").replace(/^\/+|\/+$/g, "").toLowerCase();
      var seg = rawPath.split("/")[0] || "";
      var tab = ALIASES[seg] || (ALLOWED.indexOf(seg) !== -1 ? seg : "");
      var hashTab = (window.location.hash || "").replace(/^#\/?/, "").toLowerCase();
      if (!tab && hashTab) tab = ALIASES[hashTab] || (ALLOWED.indexOf(hashTab) !== -1 ? hashTab : "");
      var target = tab && tab !== "home"
        ? (BASE_URL + "/?tab=" + encodeURIComponent(tab))
        : (BASE_URL + "/");
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div>
    <p>Перенаправление на официальный портал <b>CYBER 6 ESPORTS</b>...</p>
    <p><a href="https://cyber6esports.github.io/">Открыть https://cyber6esports.github.io/</a></p>
  </div>
</body>
</html>
